# Перехват 169.254.169.254:80 подов и host namespace в прокси на их ноде. Порт бэкенда должен совпадать с -listen
# прокси (8080 в daemonset.yaml). skipRedirectFromBackend: connect() самого прокси идёт в настоящие метаданные
# (пересылка запросов хоста при hostPassthrough), иначе — петля в себя. Без hostPassthrough connect() прокси режет deny. Стоит всегда: спека LRP
# неизменяема (redirectFrontend, skipRedirectFromBackend), правка = удалить LRP, создать и пересоздать поды прокси.
apiVersion: cilium.io/v2
kind: CiliumLocalRedirectPolicy
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: metadata-proxy
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  skipRedirectFromBackend: true
  redirectFrontend:
    addressMatcher:
      ip: 169.254.169.254
      toPorts:
        - port: "80"
          protocol: TCP
  redirectBackend:
    localEndpointSelector:
      matchLabels:
        app.kubernetes.io/name: metadata-proxy
        app.kubernetes.io/instance: {{ .Release.Name }}
    toPorts:
      - port: "8080"
        protocol: TCP
