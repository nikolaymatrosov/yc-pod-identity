# Перехват 169.254.169.254:80 подов в прокси на их ноде. redirectFrontend неизменяем: правка = удалить и создать.
apiVersion: cilium.io/v2
kind: CiliumLocalRedirectPolicy
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: metadata-proxy
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  redirectFrontend:
    addressMatcher:
      ip: 169.254.169.254
      toPorts:
        - port: "80"
          protocol: TCP
  redirectBackend:
    localEndpointSelector:
      matchLabels:
        app.kubernetes.io/name: metadata-proxy
        app.kubernetes.io/instance: {{ .Release.Name }}
    toPorts:
      - port: {{ .Values.port | quote }}
        protocol: TCP
