apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: metadata-proxy
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: metadata-proxy
      app.kubernetes.io/instance: {{ .Release.Name }}
  # updateStrategy по умолчанию (maxUnavailable: 1, без surge): при раскатке на ноде ~3 с нет бэкенда, LRP fail-open,
  # запросы ловит deny. С maxSurge: 1 окна нет, но при выключении ноды контроллер без backoff пересоздаёт поды,
  # которые kubelet отклоняет (NodeShutdown): в e2e — 110 подов за 5 с при reboot ноды, 60 остались висеть в API.
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metadata-proxy
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      priorityClassName: system-node-critical
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: metadata-proxy
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "-node-name=$(NODE_NAME)"
            - "-audience={{ .Values.audience }}"
            - "-listen=:8080"
            - "-metrics-listen=:9090"
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          # Порт открывается после синка informer-ов; NotReady-под LRP исключает из бэкендов.
          # periodSeconds: 1 — по умолчанию 10, и это почти всё окно раскатки (фаза 4).
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
