{{- /* Скобки: helm upgrade --reuse-values с релиза без podMonitor в values иначе падает на nil. */}}
{{- if (.Values.podMonitor).enabled }}
# Нужны CRD prometheus-operator. Порт metrics — не за LRP, поды его как 169.254.169.254 не видят.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: metadata-proxy
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- with .Values.podMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: metadata-proxy
      app.kubernetes.io/instance: {{ .Release.Name }}
  podMetricsEndpoints:
    - port: metrics
{{- end }}
