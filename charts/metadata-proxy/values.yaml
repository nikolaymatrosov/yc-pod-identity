image:
  repository: ghcr.io/nikolaymatrosov/yc-pod-identity
  tag: "" # пусто — appVersion чарта
  pullPolicy: IfNotPresent

# Для приватного пакета GHCR: [{name: <docker-registry secret>}]
imagePullSecrets: []

# Audience федерации (terraform output audience): с ней прокси запрашивает TokenRequest.
audience: yc-pod-identity

# Запрет 169.254.169.254/32 для всех подов, кроме SA прокси при включённом hostPassthrough: CCNP для подов вне
# namespace релиза и CNP в namespace релиза. LRP fail-open — без готового прокси на ноде запрос уходит в настоящие
# метаданные ВМ. Выключать, только если в кластере есть своя такая политика; при hostPassthrough она должна
# исключать SA прокси, иначе пересылка упрётся в deny.
denyPolicy:
  enabled: true

# Пересылка запросов host namespace. Запросы из host namespace (hostNetwork-поды, процессы ноды) к путям из paths прокси
# пересылает в настоящие метаданные ВМ: только GET, путь точно, без query. Остальное хост получает 404. Пока выключено,
# хост получает 404 на всё (CSI YC ломается, если его node-под перезапустился при готовом прокси).
#
# Цена: под прокси получает plain L4 доступ к 169.254.169.254:80 — ко ВСЕМ метаданным, включая user-data. Список
# paths соблюдает только код прокси. Скомпрометированный прокси, а также любой с правами pods/exec,
# pods/ephemeralcontainers или создания подов в namespace релиза читает все метаданные ВМ.
#
# Включать безопасно, только если в user-data нет приватных ключей CA: конфиг control plane Talos доставляется через
# maintenance mode (talosctl apply-config --insecure --cert-fingerprint …) либо user-data удаляется после старта.
#
# Даже тогда скомпрометированный прокси получает токены присоединения воркеров из user-data воркеров (machine.token,
# cluster.token, discovery clusterSecret — хватит, чтобы подключить чужую ноду, но это не cluster-admin) и токен
# сервисного аккаунта ВМ на ВМ, где он есть.
#
# L7-фильтр (Envoy) здесь невозможен: upstream-соединение Envoy из host netns снова перехватывает LRP (Cilium 1.20).
hostPassthrough:
  enabled: false
  paths:
    - /latest/dynamic/instance-identity/document # CSI YC: ID ВМ, зона
    - /latest/meta-data/hostname # CSI YC
    - /computeMetadata/v1/instance/id
    - /computeMetadata/v1/instance/zone
    - /computeMetadata/v1/instance/hostname

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

# Прокси нужен на каждой ноде, где могут жить поды.
tolerations:
  - operator: Exists
